    const tl = gsap.timeline({ paused: true });

      tl.set(`#pv${i},#ps${i},#sc${i}`, { opacity: 0 }, 0);
      tl.fromTo(`#pv${i}`, { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'power4.out' }, a);

      tl.fromTo(`#sc${i}`, { scale: 1 }, { scale: 1.05, duration: T, ease: 'none', transformOrigin: '50% 30%' }, a);
